# Local infrastructure for the Event Ticket Booking system.
# One PostgreSQL server hosts four separate databases, each owned by its own user.
# A user can connect only to its own database (see infra/postgres/01-init-databases.sql).
services:
  postgres:
    image: postgres:17-alpine
    container_name: etb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      - etb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Application services are behind the "app" profile, so a plain `docker compose up -d`
  # starts only PostgreSQL. Run them in containers with: docker compose --profile app up -d --build
  payment-mock:
    profiles: ["app"]
    build: ./services/payment-mock
    container_name: etb-payment-mock
    environment:
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_pass
      PAYMENT_MODE: ${PAYMENT_MODE:-SUCCESS}
    ports:
      - "${PAYMENT_HOST_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  etb-postgres-data:
